name: Lines (ESPN ingest + Odds API player props)

# Every two hours through the evening (UTC) and by hand. The ESPN ingest is free; /odds costs nothing for a game with no props, so scanning every in-scope game is free and
# only games that have props spend credits (stopped at the daily cap and the credit floor, see pipeline/config.py). Needs the repository secret ODDS_API_KEY.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 15,17,19,21,23,1,3 * * *"

permissions:
  contents: write

concurrency:
  group: cbb-lines
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest finished games and refresh the schedule
        run: python pipeline/ingest_daily.py
      - name: Pull player props for the games about to start
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "::notice::ODDS_API_KEY is not set; skipping the lines pull"; else python pipeline/fetch_lines.py; fi
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Lines and ingest"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the data commit after 3 attempts"; exit 1
