name: Lines (ESPN ingest + Odds API player props)

# Hourly from 14:00 to 05:59 UTC (about 9am to 1am Eastern) and by hand. The minute is deliberately 17, not 5: GitHub delays or drops scheduled runs that start near the top of the hour, and with
# "5 15,17,19,21,23,1,3" only about 3 of the 7 daily runs started, often hours late (Nov 8-10: nothing between 08:20Z and 21:00Z on Nov 10), which left the site stale. Still best effort; run by hand if it lags.
# (Was: every two hours through the evening.) The ESPN ingest is free; /odds costs nothing for a game with no props, so scanning every in-scope game is free and
# only games that have props spend credits (stopped at the daily cap and the credit floor, see pipeline/config.py). Needs the repository secret ODDS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Price games starting within this many hours (default 8; 0 = no pricing, just ingest/grade/build). pipeline/plan_refreshes.py gives the value for each wave of tip-offs."
        required: false
        default: "8"
  schedule:
    - cron: "17 14-23,0-5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cbb-lines
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest finished games and refresh the schedule
        run: python pipeline/ingest_daily.py
      - name: Pull player props for the games about to start
        env:
          HOURS_IN: ${{ inputs.hours }}
        run: |
          HOURS="${HOURS_IN:-8}"
          case "$HOURS" in ''|*[!0-9.]*) echo "::warning::hours input '$HOURS' is not a number; using 8"; HOURS=8;; esac
          if [ -z "$ODDS_API_KEY" ]; then echo "::notice::ODDS_API_KEY is not set; skipping the lines pull"; else python pipeline/fetch_lines.py --hours "$HOURS"; fi
      - name: Fill PrizePicks gaps (games The Odds API has no PrizePicks lines for)
        continue-on-error: true
        run: |
          # free (no Odds API credits), so it looks further ahead than the pricing window: PrizePicks posts a game's lines hours before tip, and a planned wave only sees its own few hours
          python pipeline/fill_pp_gaps.py --hours 16
      - name: Project the upcoming games (logged before tip) and log spread/total
        continue-on-error: true
        run: python pipeline/project.py
      - name: Grade finished lines against the box scores
        continue-on-error: true          # a grading problem must never stop the lines from being committed
        run: python pipeline/grade_lines.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Lines and ingest"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the data commit after 3 attempts"; exit 1
      - name: Build the site data (board and scorecard JSON)
        continue-on-error: true
        run: python pipeline/build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != ''     # a failed build must never replace the live site with a data-less one
        continue-on-error: true      # Pages must be switched on once: repo Settings > Pages > Source: GitHub Actions
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # deploy-pages sometimes runs right after the upload and reports "Found 0 artifact(s)" (a GitHub-side race: about one run in two on Nov 21-23, and nothing in the run turned red). So: try up to three times,
      # waiting a little between tries, and fail the run visibly if all three miss, so a stale site is never silent. The data commit above has already happened, so a failure here loses nothing.
      - uses: actions/deploy-pages@v4
        id: deploy1
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != ''
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before deploy retry 2
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deploy2
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before deploy retry 3
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v4
        id: deploy3
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail visibly if the site was not deployed
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "::error::the Pages deploy failed three times, so the live site is stale (data is committed); re-run the workflow"
          exit 1
      - name: Note a deploy that needed a retry
        if: hashFiles('site/data/board.json') != '' && hashFiles('site/data/scorecard.json') != '' && steps.deploy1.outcome == 'failure' && (steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success')
        run: echo "::notice::the Pages deploy needed a retry (first attempt found no artifact) but succeeded"
